# Core 业务 Hook 接入示例。
#
# 复制到 config/hooks.d/business.toml 后按需启用。建议：
# - 会影响主链决策的 Hook 用 require_success = true：目标不可用时发送回可重试的 503。
# - 只做标记、可以缺席的 Hook 用 require_success = false：目标不可用时跳过。
# - Hook 在发送路径上：短超时、幂等。一次发送所有 Hook 共用总时限
#   MESSAGE_INGEST_EXTENSION_PRE_SEND_TIMEOUT_MS。
# - 只想知道发生了什么的集成不要写 Hook，用事件。

[[pre_send]]
name = "risk-message-pre-send"
description = "消息发送前风控/合规门禁，可拒绝发送或补充草稿 metadata"
enabled = true
order = 100
timeout_ms = 300
require_success = true

[pre_send.selector]
conversation_types = ["single", "single_chat", "direct", "group", "group_chat"]
message_types = ["text", "image", "file", "card", "custom"]

[pre_send.transport]
type = "grpc"
endpoint = "discovery://risk-hook"

[pre_send.metadata]
hook_operation = "flare.hook.v1.pre_send"
policy = "risk_message_gate"
