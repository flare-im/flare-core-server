# 示例：部署 Hook
#
# 将本文件复制为 config/hooks.toml 后按需启用。部署文件放必需策略，改了要重启；平台和应用的 Hook
# 在 hook_configs 里，经控制台配置，立即生效。
#
# 调用链按来源排：应用 → 平台 → 部署，同来源按 order（小的先执行）。部署 Hook 在最后，看到的是最终
# 内容。require_success = true 是必需：目标不可用时回可重试的 503；false 是可选：跳过。目标明确
# 拒绝时都拒绝。

[[pre_send]]
name = "compliance-text-check"
enabled = true
order = 100
timeout_ms = 200
require_success = true

[pre_send.selector]
tenants = ["0"]
conversation_types = ["single_chat"]
message_types = ["text"]

[pre_send.transport]
type = "grpc"
endpoint = "https://hooks.internal.svc:7443"

[pre_send.metadata]
risk_level = "strict"

[[pre_send]]
name = "audit-text-tagger"
enabled = true
order = 200
timeout_ms = 100
require_success = false

[pre_send.selector]
tenants = ["0"]

[pre_send.transport]
type = "webhook"
endpoint = "https://audit.example.com/hooks/pre_send"
# 签名密钥：不签名就整行删掉；写成空串在加载时报错。
secret = "replace-me"

[pre_send.transport.headers]
X-Service = "flare-im-core"

# Capability Runtime is a service configuration, not a HookConfig field.
# Configure plugin discovery/health checks in config/services/capability.toml.
