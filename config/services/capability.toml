# Flare Capability（Hook 控制面 + Capability gRPC）
# 与 storage 共用同一数据库，但使用独立 pool profile；可用 DATABASE_URL 覆盖

[services.capability]
postgres = "capability"

[services.capability.server]
address = "0.0.0.0"
port = 50110

[capability_runtime]
plugin_call_timeout_ms = 5000

# Hook 执行证据（hook_executions）的保留期：写入在 Message Ingest，这里按保留期分批删除。
# 环境变量 FLARE_CAPABILITY_HOOK_EXECUTIONS_RETENTION_* 优先，范围见 flare-capability/README。
[hook_executions]
retention_enabled = true
retention_days = 7
retention_sweep_secs = 600
retention_delete_batch = 5000

# Prometheus 出口（共享运行时挂载；端口表见 deploy/prometheus.yml）。
[services.capability.metrics]
address = "0.0.0.0"
port = 19189
